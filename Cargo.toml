[package]
name = "xmip-core-process-bpmn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-process-bpmn"
description = "BPMN 2.0 Work Process design format: a diagram with its BPMN DI, read offline against the schemas it ships, compiled to the one Work Process program. A xmip-core-process technology."
publish.workspace = true

[dependencies]
process = { workspace = true }
xcore = { workspace = true }
assign = { workspace = true }
# A sequence flow's condition is checked as Xmip's expression language reads
# it, and a setting's value is one of its literals (ADR-0066, amendment
# 2026-11-28).
expression = { workspace = true }
# The design read by the estate's one XML reader (`codec::xml::tree`), its
# namespaces resolved; and a timer's ISO 8601 date and duration, read by the
# estate's one calendar.
codec = { workspace = true }
# The designer's view and edits cross to the runtime's exports as JSON.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
